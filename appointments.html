<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointments — Maison Élise</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-appointments">
  <div class="noise"></div>
  <header class="site-header">
    <a class="logo" href="index.html">Maison Élise</a>
    <nav class="nav">
      <a href="collections.html">Collections</a>
      <a href="high-jewelry.html">High Jewelry</a>
      <a href="heritage.html">Maison</a>
      <a href="craftsmanship.html">Craftsmanship</a>
      <a href="boutiques.html">Boutiques</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <p class="eyebrow">Private Appointment</p>
      <h1>Запросить доступ к Maison.</h1>
      <p class="lead">Запросы рассматриваются персонально. Мы ценим тишину и приватность.</p>
    </section>

    <section class="appointment-form">
      <form class="contact-form reveal">
        <label>
          Имя
          <input type="text" placeholder="Ваше имя" />
        </label>
        <label>
          Предпочтительная локация
          <input type="text" placeholder="Paris, Genève, Dubai" />
        </label>
        <label>
          Дата визита
          <input type="text" placeholder="Предпочтительный период" />
        </label>
        <label>
          Комментарий
          <textarea placeholder="Какие изделия вас интересуют?"></textarea>
        </label>
        <button class="cta" type="submit">Отправить запрос</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div>
      <p>Maison Concierge — reserved access.</p>
    </div>
    <div class="footer-links">
      <a href="boutiques.html">Boutiques</a>
      <a href="high-jewelry.html">High Jewelry</a>
      <a href="contact.html">Contact</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
